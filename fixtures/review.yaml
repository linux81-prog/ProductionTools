# FICTIONAL reviewer decisions for the Stage 1 demo.
#
# In the finished app a person makes these decisions on the review screen and in the
# annotation editor (Stage 3). For Stage 1 they live in this file so the whole
# workflow can run end to end. These were written AFTER looking at the
# machine's draft results (outputs/v*/draft_before_review/ and
# extraction_before_review.json), exactly as a person would.
#
# Supported per receipt:
#   confirm: true            -> the person checked every extracted value against the image
#   corrections: {field: {value: ..., reason: ...}}
#   positions:   {field: {page: 0, box: [x0, y0, x1, y1], reason: ...}}   (fractions of the page, 0-1)
#   number_position: [x0, y0, x1, y1]
#   account_code, description
reviewer: "Sam Rivera (fictional production accountant)"

receipts:
